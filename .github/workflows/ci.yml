name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: server (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: go vet
        run: cd server && go vet ./...

      - name: go test
        run: cd server && go test ./...

      - name: go build
        run: cd server && go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Release metadata and automation tests
        run: make release-check
      - name: Desktop launcher unit tests
        run: |
          node desktop/build-server.cjs
          node --test desktop/test/*.test.cjs

  lint-go:
    name: lint (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: golangci-lint
        run: cd server && "$(go env GOPATH)/bin/golangci-lint" run ./...

  web:
    name: web (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Unit tests
        run: cd web && npm test

      - name: Build
        run: cd compat/headlamp && npm ci && npm run build

      - name: Build web
        run: cd web && npm run build

  accounts:
    name: local accounts (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make build
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npm run e2e:server
      - name: Dex login and refresh
        run: cd web && npm run e2e:oidc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: accounts-browser-results
          path: web/test-results-server
