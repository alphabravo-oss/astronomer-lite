name: Container release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          version=$(node scripts/release-version.cjs check)
          [[ "$GITHUB_REF" == "refs/tags/v$version" ]] || { echo 'Run container publication on the matching release tag'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_OUTPUT"
      - name: Build the release image
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: docker build --build-arg VERSION="$VERSION" --build-arg REVISION="$GITHUB_SHA" -f deploy/docker/Dockerfile -t "$IMAGE" .
      - name: Smoke-test the container
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -ec 'test "$(id -u)" != 0; test -s /usr/share/licenses/astronomer-lite/THIRD-PARTY-NOTICES.txt'
          container=$(docker run -d -p 127.0.0.1::8080 "$IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          port=$(docker inspect "$container" --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}')
          for _ in {1..30}; do
            if curl --fail --silent "http://127.0.0.1:$port/api/healthz"; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the versioned image
        shell: bash
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: docker push "$IMAGE"
