name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign installers and create a draft release (requires all native runners)
        type: boolean
        default: false
      create_draft:
        description: Create an unsigned draft (stable versions require all native runners)
        type: boolean
        default: false
      native_workstations:
        description: Also validate unsigned installers on Windows 11 and graphical RHEL
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
env:
  LITE_SIGNED_RELEASE: ${{ (inputs.signed || (github.event_name == 'push' && vars.DESKTOP_RELEASE_SIGNING_ENABLED == 'true')) && 'true' || 'false' }}
  LITE_RELEASE_DRAFT: ${{ (github.event_name == 'push' || inputs.signed || inputs.create_draft) && 'true' || 'false' }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      native_required: ${{ steps.version.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: version
        shell: bash
        env:
          NATIVE_READY: ${{ vars.NATIVE_WORKSTATION_RUNNERS_READY }}
          NATIVE_REQUESTED: ${{ inputs.native_workstations }}
        run: |
          version=$(node scripts/release-version.cjs check)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo 'Release tag does not match VERSION'; exit 1
          fi
          native_required=false
          if [[ "$LITE_SIGNED_RELEASE" == true || "$NATIVE_REQUESTED" == true ]] || [[ "$LITE_RELEASE_DRAFT" == true && "$version" != *-* ]]; then
            native_required=true
            [[ "$NATIVE_READY" == true ]] || { echo 'Configure native Windows 11 and RHEL 8/9/10 runners, then set NATIVE_WORKSTATION_RUNNERS_READY=true'; exit 1; }
          fi
          echo "native_required=$native_required" >> "$GITHUB_OUTPUT"
      - run: node --test scripts/release.test.cjs
  package:
    needs: preflight
    environment: ${{ (inputs.signed || (github.event_name == 'push' && vars.DESKTOP_RELEASE_SIGNING_ENABLED == 'true')) && 'desktop-signing' || 'desktop-testing' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            targets: AppImage deb rpm
            arch: x64
          - os: windows-2025
            platform: win
            targets: nsis
            arch: x64
          - os: macos-15-intel
            platform: mac
            targets: dmg zip
            arch: x64
          - os: macos-15
            platform: mac
            targets: dmg zip
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
            compat/headlamp/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Linux packaging and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb gnupg
      - run: npm ci
        working-directory: web
      - run: npm ci && npm run build
        working-directory: compat/headlamp
      - run: npm run build
        working-directory: web
      - name: Embed web assets
        shell: bash
        run: |
          mkdir -p server/internal/server/static/dist
          cp -R web/dist/. server/internal/server/static/dist/
      - run: npm ci
        working-directory: desktop
      - name: Source quality checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          (cd server && go test ./... && go vet ./...)
          (cd web && npm run lint && npm test)
      - name: Prepare Apple notarization API key
        if: runner.os == 'macOS' && env.LITE_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          key="$RUNNER_TEMP/lite-notarization.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Package the requested OS and architecture
        run: npm run package -- --${{ matrix.platform }} ${{ matrix.targets }} --${{ matrix.arch }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.LITE_SIGNED_RELEASE }}
          CSC_LINK: ${{ runner.os == 'macOS' && env.LITE_SIGNED_RELEASE == 'true' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && env.LITE_SIGNED_RELEASE == 'true' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      - name: Notarize and staple the signed DMG
        if: runner.os == 'macOS' && env.LITE_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: ./scripts/notarize-mac-installer.sh "desktop/dist/Astronomer-Lite-$VERSION-mac-${{ matrix.arch }}.dmg"
      - name: Remove notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/lite-notarization.p8"
      - name: Sign Linux installers
        if: runner.os == 'Linux' && env.LITE_SIGNED_RELEASE == 'true'
        shell: bash
        env:
          RPM_SIGNING_KEY_BASE64: ${{ secrets.RPM_SIGNING_KEY_BASE64 }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
          RPM_SIGNING_FINGERPRINT: ${{ vars.RPM_SIGNING_FINGERPRINT }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: ./scripts/sign-linux.sh "desktop/dist/Astronomer-Lite-$VERSION-linux-x86_64.rpm"
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && env.LITE_SIGNED_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: ./scripts/verify-windows-signing.ps1 -AppDirectory desktop/dist/win-unpacked -Installer "desktop/dist/Astronomer-Lite-$env:VERSION-win-x64.exe"
      - run: npm test
        working-directory: desktop
      - name: Windows installer round trip
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results-desktop/results.json
        run: ./scripts/validate-windows-desktop.ps1 -Installer "desktop/dist/Astronomer-Lite-$env:VERSION-win-x64.exe"
      - name: Install macOS DMG package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount="$RUNNER_TEMP/lite-dmg"
          mkdir -p "$mount" "$RUNNER_TEMP/lite-installed"
          hdiutil attach "desktop/dist/Astronomer-Lite-${{ needs.preflight.outputs.version }}-mac-${{ matrix.arch }}.dmg" -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          cmp "desktop/READ ME FIRST.txt" "$mount/READ ME FIRST.txt"
          test "$(readlink "$mount/Applications")" = /Applications
          unzip -p "desktop/dist/Astronomer-Lite-${{ needs.preflight.outputs.version }}-mac-${{ matrix.arch }}.zip" 'READ ME FIRST.txt' | cmp - "desktop/READ ME FIRST.txt"
          ditto "$mount/Astronomer-Lite.app" "$RUNNER_TEMP/lite-installed/Astronomer-Lite.app"
          hdiutil detach "$mount"
          trap - EXIT
          echo "LITE_DESKTOP_EXECUTABLE=$RUNNER_TEMP/lite-installed/Astronomer-Lite.app/Contents/MacOS/Astronomer-Lite" >> "$GITHUB_ENV"
      - name: Verify installed macOS signatures and notarization
        if: runner.os == 'macOS' && env.LITE_SIGNED_RELEASE == 'true'
        shell: bash
        run: ./scripts/verify-mac-signing.sh "$RUNNER_TEMP/lite-installed/Astronomer-Lite.app"
      - name: Packaged application browser test
        timeout-minutes: 5
        if: runner.os != 'Windows'
        run: npm run e2e:desktop -- --reporter=line,json
        working-directory: web
        env:
          DEBUG: pw:browser
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results-desktop/results.json
      - name: Stage current-version artifacts and provenance
        run: node scripts/release-artifacts.cjs stage ${{ matrix.platform }}-${{ matrix.arch }}
      - name: Include Linux signature evidence
        if: runner.os == 'Linux' && env.LITE_SIGNED_RELEASE == 'true'
        shell: bash
        run: cp desktop/dist/linux-SHA256SUMS desktop/dist/linux-SHA256SUMS.asc desktop/dist/linux-signing-key.asc release/artifacts/linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: astronomer-lite-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/artifacts/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-${{ matrix.platform }}-${{ matrix.arch }}
          path: web/test-results-desktop
  rhel:
    name: RPM on RHEL ${{ matrix.major }} UBI
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        major: [8, 9, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: astronomer-lite-linux-x64
          path: desktop/dist
      - name: Install and verify the RPM on Red Hat UBI
        run: ./scripts/verify-rpm.sh desktop/dist/Astronomer-Lite-*-linux-x86_64.rpm ${{ matrix.major }}

  rhel-desktop:
    name: RHEL ${{ matrix.major }} GNOME
    needs: [preflight, package]
    if: needs.preflight.outputs.native_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        major: [8, 9, 10]
    runs-on: [self-hosted, Linux, X64, 'lite-rhel-${{ matrix.major }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: astronomer-lite-linux-x64
          path: release/downloads
      - run: npm ci
        working-directory: web
      - name: Install, test in the real desktop session, and uninstall
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results-desktop/results.json
        run: ./scripts/validate-rhel-desktop.sh "release/downloads/Astronomer-Lite-$VERSION-linux-x86_64.rpm" ${{ matrix.major }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-rhel-${{ matrix.major }}
          path: web/test-results-desktop
          if-no-files-found: error

  windows-workstation:
    name: Windows 11 workstation
    needs: [preflight, package]
    if: needs.preflight.outputs.native_required == 'true'
    runs-on: [self-hosted, Windows, X64, lite-windows-11]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: astronomer-lite-win-x64
          path: release/downloads
      - run: npm ci
        working-directory: web
      - name: Windows 11 installer round trip
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results-desktop/results.json
        run: ./scripts/validate-windows-desktop.ps1 -RequireWindows11 -Installer "release/downloads/Astronomer-Lite-$env:VERSION-win-x64.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-11
          path: web/test-results-desktop
          if-no-files-found: error

  draft-release:
    needs: [preflight, package, rhel, rhel-desktop, windows-workstation]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' || inputs.signed || inputs.create_draft) &&
      needs.preflight.result == 'success' && needs.package.result == 'success' && needs.rhel.result == 'success' &&
      (needs.rhel-desktop.result == 'success' || needs.rhel-desktop.result == 'skipped') &&
      (needs.windows-workstation.result == 'success' || needs.windows-workstation.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: ${{ (inputs.signed || (github.event_name == 'push' && vars.DESKTOP_RELEASE_SIGNING_ENABLED == 'true')) && 'desktop-signing' || 'desktop-testing' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: astronomer-lite-*
          merge-multiple: true
          path: release/artifacts/complete
      - run: node scripts/release-artifacts.cjs verify release/artifacts/complete
      - name: Record validation workflow evidence
        shell: bash
        env:
          NATIVE_VALIDATED: ${{ needs.preflight.outputs.native_required }}
        run: |
          cp "release/notes/$(cat VERSION).md" "$RUNNER_TEMP/release-notes.md"
          if [[ "$LITE_SIGNED_RELEASE" != true ]]; then
            printf '\nThese installers are unsigned; production signing and notarization are deferred.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          if [[ "$NATIVE_VALIDATED" != true ]]; then
            printf '\nWindows 11 workstation and graphical RHEL 8/9/10 validation remain pending. This prerelease does not certify those environments.\n' >> "$RUNNER_TEMP/release-notes.md"
          fi
          printf '\nValidation evidence: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
      - name: Create a draft for review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          # Never replace existing assets or publish automatically.
          gh release create "v$VERSION" release/artifacts/complete/* \
            --target "$GITHUB_SHA" --draft "${flags[@]}" \
            --title "Astronomer-Lite $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
