name: e2e

# The k3d Playwright suite is heavy (spins up a real cluster), so it does not
# run on every push. Trigger it manually via the Actions tab (workflow_dispatch)
# or by adding the "e2e" label to a pull request.
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3d:
    # Only run for manual dispatch or PRs carrying the "e2e" label.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rancher/k3s:v1.30.4-k3s1", "rancher/k3s:v1.36.5-k3s1"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install k3d
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install dependencies
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright k3d e2e
        run: |
          K3D_IMAGE="${{ matrix.image }}" \
            K3D_AGENTS=0 \
            SKIP_NPM_CI=1 \
            SKIP_PLAYWRIGHT_INSTALL=1 \
            ASTRONOMER_LITE_CONFIG_DIR="$RUNNER_TEMP/astronomer-lite" \
            SERVER_LOG="$RUNNER_TEMP/astronomer-lite.log" \
            ./scripts/run-k3d-e2e.sh
      - name: Preserve browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-browser-${{ strategy.job-index }}
          path: web/test-results-*
          if-no-files-found: ignore
